{% if self.character_image %}
    <div class="shortanswer_image">
        <img src="{{ self.character_image }}" />
    </div>
{% endif %}

<div class="shortanswer_block">
    <div>
        <div id="question-text">
            {{ question_text | safe }}
        </div>
    </div>

    <div class="chat-wrapper">
        {% for character in characters %}
            <div class="chat-chatbox-half" id="chat-chatbox-{{ forloop.counter0 }}">
                <h3><b>{{ character.role }}</b></h3>
                <div class="chat-submit-row">
                    {% if forloop.first %}
                        {% if self.allow_reset %}
                            <span class="chat-button chat-reset-button">Reset chat</span>
                        {% endif %}
                        {% if has_finish_button %}
                            <span class="chat-button chat-finish-button">Submit for evaluation</span>
                        {% endif %}
                    {% endif %}
                </div>
                <div class="chat-history">
                    <div class="chat-message-container chat-spinner-container">
                        <div class="chat-message message-spinner" style="display: none;">
                            <div class="bounce1">
                            </div>
                            <div class="bounce2">
                            </div>
                            <div class="bounce3">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="chat-submit-row">
                    <textarea class="chat-user-input" rows="1" placeholder="Type your answer here" maxlength="1000"></textarea>
                    <span class="chat-button chat-submit-button">Submit <i class="fa fa-paper-plane"></i></span>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
