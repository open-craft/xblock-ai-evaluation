[tox]
envlist = py{311,312}-django{42},quality,translations

[pycodestyle]
exclude = .git,.tox,migrations

[pytest]
# The workbench settings plus the ai_eval app (see ai_eval/tests/settings.py).
DJANGO_SETTINGS_MODULE = ai_eval.tests.settings
# tox installs the package without its tests, so import ai_eval from the source tree, where the settings module is.
pythonpath = .
addopts = --cov-report term-missing --cov-report xml --cov-report html -vv
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning

[testenv]
allowlist_externals =
    make
    mkdir
deps =
    django42: Django>=4.2,<4.3
    -r{toxinidir}/requirements/test.txt
commands =
    mkdir -p var
    pytest --cov ai_eval

[testenv:quality]
deps =
    -r{toxinidir}/requirements/quality.txt
commands =
    pycodestyle ai_eval setup.py --max-line-length=120
    pylint ai_eval

[testenv:translations]
allowlist_externals =
    make
deps =
    Django>=4.2,<4.3
    -r{toxinidir}/requirements/test.txt
commands =
    make check_translations_up_to_date
